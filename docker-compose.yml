name: property_management

services:
  backend:
    networks:
      - default
      - shared-proxy
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "python", "manage.py", "check", "--deploy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      DOMAIN: "${DOMAIN:-213-199-50-129.sslip.io}"
      DEBUG: "${DEBUG:-True}"
      ALLOWED_HOSTS: "*"
      EMAIL_BACKEND: "${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}"
      EMAIL_HOST: "${EMAIL_HOST}"
      EMAIL_PORT: "${EMAIL_PORT:-587}"
      EMAIL_USE_TLS: "${EMAIL_USE_TLS:-True}"
      EMAIL_USE_SSL: "${EMAIL_USE_SSL:-False}"
      EMAIL_HOST_USER: "${EMAIL_HOST_USER}"
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD}"
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-admin@eltee.store}"
      SEED_USER_PASSWORD: "${SEED_USER_PASSWORD:-changeme123!}"
    volumes:
      - ./backend:/app
    command: ["sh", "-c", "python manage.py migrate && python manage.py runserver 0.0.0.0:8001"]

  web:
    networks:
      - default
      - shared-proxy
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      DOMAIN: "${DOMAIN:-213-199-50-129.sslip.io}"
      NEXT_PUBLIC_API_BASE_URL: "https://pmapi.${DOMAIN:-213-199-50-129.sslip.io}/api"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    command: ["sh", "-c", "npm install && npm run dev -- -p 3000 -H 0.0.0.0"]
    depends_on:
      backend:
        condition: service_started

  mobile_admin:
    networks:
      - default
      - shared-proxy
    build:
      context: .
      dockerfile: docker/Dockerfile.expo
      args:
        APP_DIR: mobile-admin
    environment:
      DOMAIN: "${DOMAIN:-213-199-50-129.sslip.io}"
      EXPO_NO_KEEP_AWAKE: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PACKAGER_PROXY_URL: ""
      REACT_NATIVE_PACKAGER_HOSTNAME: "pmadmin.${DOMAIN:-213-199-50-129.sslip.io}"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./mobile-admin:/app
      - mobile_admin_node_modules:/app/node_modules
    command: ["sh", "-c", "npm install --legacy-peer-deps && npx expo start --port 8084 --lan --clear"]
    ports:
      - "8084"
    tty: true
    stdin_open: true

  mobile_host:
    networks:
      - default
      - shared-proxy
    build:
      context: .
      dockerfile: docker/Dockerfile.expo
      args:
        APP_DIR: mobile-host
    environment:
      DOMAIN: "${DOMAIN:-213-199-50-129.sslip.io}"
      EXPO_NO_KEEP_AWAKE: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PACKAGER_PROXY_URL: ""
      REACT_NATIVE_PACKAGER_HOSTNAME: "pmhost.${DOMAIN:-213-199-50-129.sslip.io}"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./mobile-host:/app
      - mobile_host_node_modules:/app/node_modules
    command: ["sh", "-c", "npm install --legacy-peer-deps && npx expo start --port 8085 --lan --clear"]
    ports:
      - "8085"
    tty: true
    stdin_open: true

  mobile_kiosk:
    networks:
      - default
      - shared-proxy
    build:
      context: .
      dockerfile: docker/Dockerfile.expo
      args:
        APP_DIR: mobile-kiosk
    environment:
      DOMAIN: "${DOMAIN:-213-199-50-129.sslip.io}"
      EXPO_NO_KEEP_AWAKE: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PACKAGER_PROXY_URL: ""
      REACT_NATIVE_PACKAGER_HOSTNAME: "pmkiosk.${DOMAIN:-213-199-50-129.sslip.io}"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./mobile-kiosk:/app
      - mobile_kiosk_node_modules:/app/node_modules
    command: ["sh", "-c", "npm install --legacy-peer-deps && npx expo start --port 8086 --lan --clear"]
    ports:
      - "8086"
    tty: true
    stdin_open: true

networks:
  shared-proxy:
    external: true

volumes:
  web_node_modules:
  mobile_admin_node_modules:
  mobile_host_node_modules:
  mobile_kiosk_node_modules:
