services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
      EMAIL_HOST: "${EMAIL_HOST}"
      EMAIL_PORT: "${EMAIL_PORT:-587}"
      EMAIL_USE_TLS: "${EMAIL_USE_TLS:-True}"
      EMAIL_USE_SSL: "${EMAIL_USE_SSL:-False}"
      EMAIL_HOST_USER: "${EMAIL_HOST_USER}"
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD}"
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-admin@eltee.store}"
      SEED_USER_PASSWORD: "${SEED_USER_PASSWORD:-changeme123!}"
    volumes:
      - ./backend:/app
    command: ["sh", "-c", "python manage.py migrate && python manage.py runserver 0.0.0.0:8001"]
    ports:
      - "8001"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: "https://pmapi.213-199-50-129.sslip.io/api"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    command: ["sh", "-c", "npm install && npm run dev -- -p 3000 -H 0.0.0.0"]
    ports:
      - "3000"
    depends_on:
      - backend

  mobile_admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.expo
      args:
        APP_DIR: mobile-admin
    environment:
      EXPO_NO_KEEP_AWAKE: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PACKAGER_PROXY_URL: ""
      REACT_NATIVE_PACKAGER_HOSTNAME: "pmadmin.213-199-50-129.sslip.io"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./mobile-admin:/app
      - mobile_admin_node_modules:/app/node_modules
    command: ["sh", "-c", "npm install --legacy-peer-deps && npx expo start --port 8084 --lan --clear"]
    tty: true
    stdin_open: true
    ports:
      - "8084:8084"

  mobile_host:
    build:
      context: .
      dockerfile: docker/Dockerfile.expo
      args:
        APP_DIR: mobile-host
    environment:
      EXPO_NO_KEEP_AWAKE: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PACKAGER_PROXY_URL: ""
      REACT_NATIVE_PACKAGER_HOSTNAME: "pmhost.213-199-50-129.sslip.io"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./mobile-host:/app
      - mobile_host_node_modules:/app/node_modules
    command: ["sh", "-c", "npm install --legacy-peer-deps && npx expo start --port 8085 --lan --clear"]
    tty: true
    stdin_open: true
    ports:
      - "8085:8085"

  mobile_kiosk:
    build:
      context: .
      dockerfile: docker/Dockerfile.expo
      args:
        APP_DIR: mobile-kiosk
    environment:
      EXPO_NO_KEEP_AWAKE: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PACKAGER_PROXY_URL: ""
      REACT_NATIVE_PACKAGER_HOSTNAME: "pmkiosk.213-199-50-129.sslip.io"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./mobile-kiosk:/app
      - mobile_kiosk_node_modules:/app/node_modules
    command: ["sh", "-c", "npm install --legacy-peer-deps && npx expo start --port 8086 --lan --clear"]
    tty: true
    stdin_open: true
    ports:
      - "8086:8086"

volumes:
  web_node_modules:
  mobile_admin_node_modules:
  mobile_host_node_modules:
  mobile_kiosk_node_modules:
